# After each push to main, wait for Cloudflare Pages to deploy, then tell
# Bing and the other IndexNow engines which pages changed.
# Run it by hand from the Actions tab with "all" ticked to submit every page.
name: Notify search engines

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      all:
        description: Submit every page in the sitemap
        type: boolean
        default: true

jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for Cloudflare Pages to deploy
        if: github.event_name == 'push'
        run: sleep 240
      - name: Submit changed pages
        if: github.event_name == 'push'
        run: node scripts/indexnow.mjs --changed ${{ github.event.before }} ${{ github.sha }}
      - name: Submit every page
        if: github.event_name == 'workflow_dispatch' && inputs.all
        run: node scripts/indexnow.mjs --all
